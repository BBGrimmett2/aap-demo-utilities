---
controller_credentials:
  - name: Utilities SCM
    description: GitHub for Ansible SCM access
    organization: Utilities
    credential_type: Source Control
    inputs:
      username: "{{ vault_github_username }}"
      password: "{{ vault_github_token }}"

  - name: Utilities - GitHub Credential
    description: GitHub Credential for SCM access
    organization: Utilities
    credential_type: GitHub Credential
    inputs:
      username: "{{ vault_github_username }}"
      token: "{{ vault_github_token }}"

  - name: Red Hat Console Published Content Credential
    description: Credential for accessing Red Hat Console published content
    credential_type: Ansible Galaxy/Automation Hub API Token
    inputs:
      url: "{{ vault_automation_hub_published_url }}"
      token: "{{ vault_automation_hub_token }}"
      auth_url: "{{ vault_automation_hub_auth_url }}"

  - name: Red Hat Console Validated Content Credential
    description: Credential for accessing Red Hat Console validated content
    credential_type: Ansible Galaxy/Automation Hub API Token
    inputs:
      url: "{{ vault_automation_hub_validated_url }}"
      token: "{{ vault_automation_hub_token }}"
      auth_url: "{{ vault_automation_hub_auth_url }}"

  - name: Red Hat Console Community Content Credential
    description: Credential for accessing community content
    credential_type: Ansible Galaxy/Automation Hub API Token
    inputs:
      url: "{{ vault_automation_hub_community_url }}"
      token: "{{ vault_automation_hub_community_token | default(vault_automation_hub_token) }}"
      auth_url: "{{ vault_automation_hub_auth_url }}"