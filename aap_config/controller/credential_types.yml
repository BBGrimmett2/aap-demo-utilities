---
controller_credential_types:
- name: GitHub Credential
  description: GitHub Credential for SCM access
  inputs:
  - type: string
    id: username
    label: GitHub Username
  - secret: true
    type: string
    id: token
    label: GitHub Token
  required:
  - username
  - token
  injectors:
    extra_vars:
      github_username: !unsafe "{{ username }}"
      github_token: !unsafe "{{ token }}"
    env:
      github_username_env: !unsafe "{{ username }}"
      github_token_env: !unsafe "{{ token }}"
